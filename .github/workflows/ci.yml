name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Type-check · Lint · Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint . --ext .ts,.tsx

      # Formatting is checked in CI because it does not hold otherwise. This
      # step was added after 26 files had drifted out of Prettier style: the
      # scripts existed, nothing ran them, and the diff noise landed in
      # unrelated reviews. A check that is not enforced is a suggestion.
      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test -- --ci --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # ── Accessibility ──────────────────────────────────────────────────────────
  #
  # e2e/a11y.spec.ts already scanned every public route with axe-core, pinned to
  # WCAG 2.1 AA, in BOTH themes. Nothing ran it.
  #
  # That is the worse version of having no standard: the standard was right, and
  # it only ran when somebody remembered. `__tests__/a11y.test.tsx` (jest-axe on
  # three components) did run, which made the gap easy to miss — component-level
  # coverage is not page-level coverage, and contrast, landmarks and heading
  # order only exist on a rendered page.
  #
  # This portfolio is the artefact a recruiter opens first. An a11y regression
  # here is visible to exactly the audience it is written for.
  a11y:
    name: Accessibility — WCAG 2.1 AA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Chromium only. These axe rules are about markup, contrast, names and
      # heading order — none differ by engine, so more browsers would multiply
      # the runtime to re-confirm the same answer. The spec drives mobile and
      # desktop viewports itself, which is the axis that actually changes.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the WCAG sweep
        run: npx playwright test e2e/a11y.spec.ts

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ── Recruiter journey + SEO contract ───────────────────────────────────────
  #
  # Two more specs that nothing ran: recruiter-journey (home → portfolio →
  # project → /engineering → resume PDF → /contact, asserting the outcome of
  # each step and the ABSENCE of the availability copy and phone number removed
  # on 2026-09-03) and meta-and-schema (every route's title / canonical /
  # JSON-LD, sitemap ↔ robots ↔ servable routes). Both went stale on main for
  # days without anyone noticing, which is the argument for running them.
  #
  # A separate job rather than more steps in the a11y job: that one already
  # takes ~7 minutes, and jobs run in parallel so this adds no wall-clock.
  # Against a PRODUCTION build (the a11y job uses `next dev`) — the SEO
  # contract is about what the built site serves. Chromium only: the journey's
  # nav helper handles both viewports, but the contract is not engine-specific
  # and the second project would double the runtime to learn the same thing.
  e2e:
    name: E2E — recruiter journey · meta & schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run the journey and SEO specs against the production build
        run: npx playwright test e2e/recruiter-journey.spec.ts e2e/meta-and-schema.spec.ts --project=chromium
        env:
          PLAYWRIGHT_WEB_SERVER_COMMAND: npx next start -p 3000

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
